<!DOCTYPE html>
<html>
    <head>
        <title>Simple Calculator Program</title>
    </head>
    <body>
        <h1>Calculator</h1>
        <script>
            document.write("Enter 2 numbers and select an operation:");
            function AddNum(){
                var num1 = parseInt(document.getElementById("num1").value);
                var num2 = parseInt(document.getElementById("num2").value);
                let result = num1 + num2;
                
                document.getElementById("result").innerHTML = "The result is " + result.toString();
            }

            function SubNum(){
                var num1 = parseInt(document.getElementById("num1").value);
                var num2 = parseInt(document.getElementById("num2").value);
                let result = num1 - num2;

                document.getElementById("result").innerHTML = "The result is " + result.toString();
            }

            function MulNum(){
                var num1 = parseInt(document.getElementById("num1").value);
                var num2 = parseInt(document.getElementById("num2").value);
                let result = num1 * num2;

                document.getElementById("result").innerHTML = "The result is " + result.toString();
            }

            function DivNum(){
                var num1 = parseInt(document.getElementById("num1").value);
                var num2 = parseInt(document.getElementById("num2").value);
                let result = num1 / num2;

                document.getElementById("result").innerHTML = "The result is " + result.toString();
            }
        </script>

            <input type = "text" id = "num1"></input>
            <input type = "text" id = "num2"></input>
            <br>
            <input type = "button" onClick = "AddNum()" value = "Add"></input>
            
            <input type = "button" onClick = "SubNum()" value = "Subtract"></input>
            
            <input type = "button" onClick = "MulNum()" value = "Multiply"></input>
            
            <input type = "button" onClick = "DivNum()" value = "Divide"></input>
            
            <p id = "result"></p>
    </body>
</html>
