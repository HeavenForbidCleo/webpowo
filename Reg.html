<!DOCTYPE html>
<html>
    <head>
        <title>W3.CSS Registration</title>
        <link rel="stylesheet" href="https://www.w3schools.com/w3css/5/w3.css">
        <style>
            body{margin-top: 30px; margin-bottom: 30px; margin-left: 30px; margin-right: 30px;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;}
            h1{font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;}
        </style>
    </head>
    <body>
          <form class="w3-container">
            <h1 class="w3-text-teal w3-text-center">User Registration</h1>
            
            <label>First Name*:</label>
            <input class = "w3-input w3-border" type = "text">
            <br>
            
            <label>Last Name:</label>
            <input class = "w3-input w3-border" type = "text">
            <br>

            
            <label>Email Address*:</label>
            <input class = "w3-input w3-border" type = "email">
            <br>

            
            <label>Password*:</label>
            <input class = "w3-input w3-border" type = "password">
            <br>

            
            <label>Confirm Password*:</label>
            <input class = "w3-input w3-border" type = "password">
            <br>

            <label>Gender:</label>
            <select class = "w3-select" name = "gender">
                <option value = " " disabled selected>Choose your gender</option>
                <option value = "Female">Female</option>
                <option value = "Male">Male</option>
            </select>  
            <br><br>

            
            <label>Date of Birth*:</label> <br>
            <input type = "date" name = "dob">
            <br><br>

            <label>Address:</label>
            <div class = "w3-row-padding" style="width:900px">
                <div class = "w3-third">
                    <input placeholder="Address1"
                    class = "w3-input w3-border"
                    type = "text">
                </div>
                
                <div class = "w3-third">
                    <input placeholder="Postcode"
                    class = "w3-input w3-border"
                    type = "text">
                </div>
                
                <div class = "w3-third">
                    <input placeholder="Country"
                    class = "w3-input w3-border"
                    type = "text">
                </div>
            
                <div class = "w3-third">
                    <input placeholder="Address2"
                    class = "w3-input w3-border"
                    type = "text">
                </div>
                
                <div class = "w3-third">
                    <input placeholder="State"
                    class = "w3-input w3-border"
                    type = "text">
                </div>
            </div>
            <br>
            <div>
                <label>Preferred payment method:</label><br>
                <input class = "w3-radio"
                    type = radio 
                    name = "pay"
                    value = "credit"
                    checked>Credit Card
                    <br>

                <input class = "w3-radio"
                    type = radio
                    name = "pay"
                    value = "debit"
                    checked>Debit Card
                    <br>

                <input class = "w3-radio"
                    type = radio 
                    name = "pay"
                    value = "OnlineBank"
                    checked>Online Banking
                    <br>
            </div>
            <br>
            <button class="w3-btn w3-block w3-teal" style="width: 500px">Register</button>     
          </form>
    </body>
</html>
