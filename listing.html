<!DOCTYPE html>
<html>
    <header>
        <title>Listings</title>
    </header>
    <h1>Favourite drink for breakfast</h1>
    
    <body>
        <ul type = "square"> <!--disk or circle-->
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ul>

        <ol type = "I"> <!---or any alphabets-->
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ol>

        <ol start="50">
            <li>Coffee</li>
            <li>Tea</li>
            <li>Milk</li>
        </ol>
    </body>
</html>
