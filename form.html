<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
    </head>

    <body>
        <form action = "">
            <fieldset>
                <legend>Personal Information:</legend>

                First name: <br>
                <input type = "text"
                        name = "firstname">
                <br>
                
                Last name: <br>
                <input type = "text"
                        name = "lastname">
                <br>

                <br><br>
                <!---radio button type-->
            <fieldset>
                <br>Sex:<br>
                <input type = "radio" 
                        name = "gender"
                        value = "male"
                        checked>Male  <!---check only one of it-->
                
                <input type = "radio"
                        name = "gender"
                        value = "female"
                        >Female<br>
                <br>
            </fieldset>

            <fieldset>
                <br>Date of birth:<br>
                 <input type = "date" 
                        name = "dob">
                <br><br>
            </fieldset>  
                
            <fieldset>
                <input type = "checkbox" 
                        name = "emailCb"
                        value = "Email"
                        >My email<br>
                
                <input type = "checkbox"
                        name = "phoneCb"
                        value = "Phone">Mobile phone

                <br>
            </fieldset>
                
                <input type = "submit"
                        value = "Submit">
        </form>
    </body>
</html>
