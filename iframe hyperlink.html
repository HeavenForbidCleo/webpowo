<!DOCTYPE html>
<html>
    <header>
    <title>iFrame hyperlink</title>
    </header>

    <body>
        <h2 style = "color:blue;">Fruit</h2>
        <a href="https://en.wikipedia.org/wiki/Durian"
            target="iframe_a">Durian</a>

        <a href="https://en.wikipedia.org/wiki/Rambutan"
            target="iframe_a">Rambutan</a>

        <br>
        <iframe height="300px" width="70%"
                src="https://en.wikipedia.org/wiki/Anggur"
                name="iframe_a"></iframe>

        <h1 style="color:blue">iFrame Example</h1>
        <h2 style="background-color:yellow">This page show the use of iFrame with cheetah website and a video link</h2>
        
        <h3>Cheetah info</h3>
        <iframe src="https://en.wikipedia.org/wiki/cheetah" height="200" width="300"></iframe>

        <h3>Cheetah video</h3>
        <iframe width="560" height="315"
                src="https://www.youtube.com/embed/J20eXhZTHEo"
                frameborder="0" allowfullscreen></iframe>
    </body>
</html>
