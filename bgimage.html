<!DOCTYPE html>
<html>
    <head>
        <title>CSS BG</title>
        <style>
            body{
                background:rgb(161, 185, 121) url('pictures/cheetah cub.jpg')no-repeat right top;
                margin-right: 400px;
            }

            h1{
                color:rgb(37, 59, 4);
                text-align:left;
                text-transform: uppercase;
            }

            h2{
                color: rgb(160, 86, 12);
                text-decoration: underline;
                letter-spacing:2px;
                text-shadow: 1px 2px rgb(99, 88, 88);
            }

            pre{
                text-align:left;
                word-spacing: -1px;
            }
        </style>
    </head>
    <body>
        <h1>Hello World!</h1>
        <h2>Hello Cheetah</h2>
        <pre>
        Now the background image is only shown once, 
        and it is also positioned away from the text.
        In this example we have also added a margin on the right 
        side, so that the background image will not disturb the text.</p>
        </pre>
    </body>
</html>
