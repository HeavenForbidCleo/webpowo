<!DOCTYPE html>
<html>
    <head>
        <title>Bootstrap Registration</title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <style>
                body{margin-top: 30px; margin-bottom: 30px; margin-left: 30px; margin-right: 700px;              
                     font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;}
                h1{color:rgb(64, 110, 211); font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;}
       
        </style>
    </head>
    <body>
        
            <h1>User Registration</h1>
            
            <div class = "form-group">
                <label for = "first">First Name:</label>
                <input type = "text" class = "form-control" id = "first">
                <br>
                <label for = "last">Last Name</label>
                <input type = "text" class = "form-control" id = "last">
            </div>

            <div class = "form-group">
                <label for = "email">Email Address</label>
                <input type = "email" class = "form-control" id = "email">
            </div>
            
            <div class = "form-group">'
                <label for = "pwd">Password*</label>
                <input type = "password" class = "form-control" id = "pwd">
                <br>
                <label for = "pwd">Confirm Password*</label>
                <input type = "password" class = "form-control" id = "pwd">
            </div>
            
            <div class = "form-group">
                <label for = "gender">Choose your gender</label>
                <select class = "form-control" id = "gender">
                        <option value = "Female">Female</option>
                        <option value = "Male">Male</option>
                </select>      
            </div>
            
            <div class="date">
                <label for = "dob">Date of Birth*:</label> 
                <input type = "date" class = "form-control" id = "dob">
            </div>
            
            <div class = "form-group">
                <label for = "add1">Address:</label>
                <br>
                <input placeholder="address1"
                    type = "text"
                    class = "form-control"
                    id = "add1"><br>
                <input placeholder="address2"
                    type = "text"
                    class = "form-control"
                    name = "add1"><br>
                
                <label for = "poskod">Postcode:</label><br>
                <input type = "number" class = "form-control" id = "poskod"><br>
                
                <label for = "state">State:</label> 
                <input type = "text" class = "form-control" id = "state">
                <br>

                <label for = "country">Country:</label>
                <input type = "text" class = "form-control" id = "country">
            </div>

            <b>Payment Method:</b><br>
            <div class = "radio">
                <label>
                        <input type = radio 
                                name = "pay"
                                checked>Credit Card
                </label>
            </div>
            
            <div class = "radio">
                <label>
                        <input type = radio
                                name = "pay"
                                checked>Debit Card
                </label>
            </div>

            <div class = "radio">
                <label>
                        <input type = radio 
                                name = "pay"
                                checked>Online Banking
                </label>
            </div>
            <button type="button" class="btn btn-primary" style = "width: 470px">Register</button>

    </body>
</html>
