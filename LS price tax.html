<!DOCTYPE html>
<html>
    <head>
        <title>Price Tax</title>
        <style>
            table, td, th{
                border: 1px solid black;
                border-collapse:separate;
            }
        </style>
    </head>

    <body>
        <h1>Check Price Tax</h1>
        <p>This program will check and display the Price With Tax:</p>
        <table>
            <tr><th>Price</th>
                <th>Tax Rates (%)</th>
            </tr>
            <tr>
                <td>>=100</td>
                <td>4%</td>
            </tr>
            <tr>
                <td>&lt;100 </td>
                <td>2%</td>
            </tr>
        </table>

        <script>
            document.write("Enter price (RM):");
            function checkPrice(){
                var price = parseInt(document.getElementById("price").value);
                var tax;
                if (price >= 100){
                    tax = (price * 0.04) + price;
                }
                else{
                    tax = (price * 0.02) + price;
                }

                document.getElementById("priceTax").innerHTML = "Total price with tax: RM" + tax.toFixed(2);
            }
        </script>

        <input type = "text" id = "price"></input>
        <input type = "button" onClick = "checkPrice()" value = "Check Price"></input>
        <p id = "priceTax"></p>
        
    </body>
</html>
