<!DOCTYPE html>
<html>
    <head>
        <title>Employee Bonus Calculator</title>
    </head>
    <body>
        <h1>Employee Bonus Calculator</h1>

        <script>
            document.write("Monthly Sales (RM):");

            function calcBonus(){
                var sales = parseFloat(document.getElementById("sales").value);
                var bonus = 0;
                var total = 0;

                if (sales < 5000){
                    total = sales;
                }
                else if (sales >= 5000 && sales <= 10000){
                    bonus = sales * 0.05;
                    total = sales + bonus;
                }
                else if (sales > 10000 && sales < 20000){
                    bonus = sales * 0.1;
                    total = sales + bonus;
                }
                else{
                    bonus = sales * 0.15;
                    total = sales + bonus;
                }
                
                document.getElementById("Sales").innerHTML = "<b>Sales:</b> RM " + sales.toFixed(2);
                document.getElementById("bonus").innerHTML = "<b>Bonus:</b> RM " + bonus.toFixed(2);
                document.getElementById("total").innerHTML = "<b>Total Income:</b> RM " + total.toFixed(2); 
            }
        </script>
        <input type = "text" id = "sales"></input>
        <br><br>
        <input type = "button" onClick = "calcBonus()" value = "Calculate Bonus"></input>
        <br><br>
        <fieldset>
            <p id = "Sales"></p>
            <p id = "bonus"></p>
            <p id = "total"></p> 
        </fieldset>
    </body>
</html>
